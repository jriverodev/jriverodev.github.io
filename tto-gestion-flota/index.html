<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAGOP - Autenticación Institucional Multi-Tenant</title>
    <script src="./js/libs/browser@4.js"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-scheme: light dark;
        }
        @variant dark (&:where(.dark, .dark *));
    </style>
    <link rel="stylesheet" href="css/fontawesome/all.min.css">
    <link rel="manifest" href="manifest.json">
    <script src="js/app.js" defer></script>
    <script src="js/dexie.min.js" defer></script>
    <script src="js/db.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js" defer></script>
    <script src="js/supabase-sync.js" defer></script>
    <script src="js/sync-manager.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script>window.SIAGOP_DEBUG_UI = true;</script>
    <script src="js/tema.js" defer></script>
    <script src="js/auth-gatekeeper.js" defer></script>
    <script src="js/header-led.js" defer></script>
    <script src="js/BottomNav.js" defer></script>
    <script src="js/roles.js" defer></script>
    <script src="js/profile-header.js" defer></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans selection:bg-blue-500 selection:text-white antialiased">

    <header class="w-full bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 transition-colors sticky top-0 z-50">
        <div class="flex items-center h-14 px-2">
            <!-- Atrás -->
            <a href="index.html" title="Inicio" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors active:scale-95">
                <i class="fa-solid fa-arrow-left text-slate-700 dark:text-slate-300"></i>
            </a>
            <!-- Título -->
            <h1 class="ml-2 text-base font-semibold text-slate-900 dark:text-slate-50 truncate">SIAGOP Móvil</h1>
            <!-- Spacer -->
            <div class="flex-1"></div>
            <!-- LED estado -->
            <span id="led-network-status" class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_6px_rgba(16,185,129,0.8)] mr-2 inline-block"></span>
            <!-- Tema -->
            <button onclick="toggleTema()" title="Cambiar Tema" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors active:scale-95">
                <i class="fa-solid fa-sun text-slate-700 dark:text-slate-300 theme-toggle-icon"></i>
            </button>
            <!-- Perfil -->
            <div class="relative">
                <button onclick="window.SIAGOP_PROFILE.toggleDropdown()" title="Perfil de usuario" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors active:scale-95">
                    <i class="fa-solid fa-user text-slate-700 dark:text-slate-300"></i>
                </button>
                <div id="siagop-profile-dropdown" class="hidden absolute right-0 top-12 w-64 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-2xl z-50 p-3">
                    <p id="header-organizacion-nombre" class="text-[9px] font-black uppercase tracking-widest text-slate-400 px-2 pb-2 border-b border-slate-200 dark:border-slate-700 mb-2">
                        Gerencia de Transporte Terrestre Occidente
                    </p>
                    <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors">
                        <i class="fa-solid fa-house text-blue-500 w-4"></i> Inicio
                    </a>
                    <button onclick="window.SIAGOP_PROFILE.cerrarSesionCompleta()" class="w-full flex items-center gap-3 px-3 py-2.5 text-sm font-medium text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40 rounded-lg transition-colors cursor-pointer text-left">
                        <i class="fa-solid fa-right-from-bracket w-4"></i> Cerrar Sesión
                    </button>
                </div>
            </div>
        </div>
        <!-- Sub-barra de contexto -->
        <div class="flex items-center h-8 px-4 bg-slate-50 dark:bg-slate-900/50 border-t border-slate-100 dark:border-slate-700/50">
            <p class="text-[10px] font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">Acceso & Gestión Operativa</p>
        </div>
    </header>

    <main class="max-w-md mx-auto w-full px-4 py-8 flex-grow flex flex-col justify-center">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600/10 border border-blue-500/20 text-blue-400 mb-3">
                    <i class="fa-solid fa-shield-halved text-2xl"></i>
                </div>
                <h2 class="text-lg font-black uppercase tracking-tight text-white mb-1">Ingreso de Organización</h2>
                <p class="text-xs text-slate-400">Ingrese su código y credenciales asignadas</p>
            </div>

            <form id="formAccesoInstitucional" onsubmit="iniciarSesionInstitucional(event)" class="space-y-4" autocomplete="off">
                <div>
                    <label class="block text-[10px] uppercase font-black tracking-widest text-slate-400 mb-1.5">
                        Código de Organización <span class="text-blue-500">*</span>
                    </label>
                    <input type="text" id="input-codigo-org" required placeholder="Ej: GTTO"
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white uppercase focus:outline-none focus:border-blue-500 transition-all font-mono tracking-wider">
                </div>

                <div>
                    <label class="block text-[10px] uppercase font-black tracking-widest text-slate-400 mb-1.5">
                        Usuario / Operador <span class="text-blue-500">*</span>
                    </label>
                    <input type="text" id="input-usuario-login" required placeholder="Ej: ADMINISTRADOR"
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white uppercase focus:outline-none focus:border-blue-500 transition-all font-medium">
                </div>

                <div>
                    <label class="block text-[10px] uppercase font-black tracking-widest text-slate-400 mb-1.5">
                        Contraseña <span class="text-blue-500">*</span>
                    </label>
                    <input type="password" id="input-password-login" required placeholder="••••••••"
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-blue-500 transition-all font-mono tracking-widest">
                </div>

                <div id="error-login-institucional" class="hidden text-xs font-bold text-rose-400 bg-rose-500/10 border border-rose-500/20 p-3 rounded-xl text-center"></div>

                <button type="submit" id="btn-submit-login" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-3.5 rounded-xl font-black uppercase tracking-widest text-xs transition-all shadow-lg shadow-blue-600/20 active:scale-95 cursor-pointer flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
                </button>
            </form>

            <div class="mt-6 pt-4 border-t border-slate-800 text-center">
                <a href="registro-organizacion.html" class="text-xs font-semibold text-blue-400 hover:underline transition-all">
                    ¿Deseas solicitar registro para tu organización?
                </a>
            </div>
        </div>
    </main>

    <footer class="w-full text-center py-4 border-t border-slate-800 bg-slate-900">
        <p class="text-[10px] text-slate-400 uppercase tracking-widest font-black">
             SIAGOP — Sistema Integrado de Automatización y Gestión Operativa
        </p>
    </footer>

    <script>
        async function iniciarSesionInstitucional(event) {
            event.preventDefault();
            const errDiv = document.getElementById('error-login-institucional');
            const btnSubmit = document.getElementById('btn-submit-login');
            if (errDiv) errDiv.classList.add('hidden');

            const codigoOrg = document.getElementById('input-codigo-org').value.trim();
            const usuarioReq = document.getElementById('input-usuario-login').value.trim();
            const passReq = document.getElementById('input-password-login').value.trim();

            if (!codigoOrg || !usuarioReq || !passReq) {
                if (errDiv) {
                    errDiv.textContent = 'Ingrese el código de organización, usuario y contraseña.';
                    errDiv.classList.remove('hidden');
                }
                return;
            }

            btnSubmit.disabled = true;

            const client = typeof ensureSupabaseClient === 'function' ? ensureSupabaseClient() : null;

            if (navigator.onLine && client) {
                try {
                    const { data, error } = await client.rpc('validar_licencia_y_usuario', {
                        p_codigo_interno: codigoOrg,
                        p_usuario: usuarioReq,
                        p_password: passReq
                    });

                    if (!error) {
                        const res = Array.isArray(data) ? data[0] : data;
                        if (res && res.permitido) {
                            localStorage.setItem('siagop_user_id', res.usuario_id);
                            localStorage.setItem('siagop_user_org_id', res.organizacion_id);
                            localStorage.setItem('organizacion_nombre', res.organizacion_nombre);

                            const userRol = res.rol_id || 'admin';
                            const userMod = res.modulo || 'TODOS';

                            sessionStorage.setItem('SIAGOP_SESSION_TOKEN', 'tok-inst-' + Date.now());
                            sessionStorage.setItem('SIAGOP_OPERADOR', res.usuario_nombre || usuarioReq);
                            sessionStorage.setItem('SIAGOP_ROL', userRol);
                            sessionStorage.setItem('SIAGOP_MODULO', userMod);
                            sessionStorage.setItem('SIAGOP_USER_ID', res.usuario_id);
                            sessionStorage.setItem('SIAGOP_USER_ORG_ID', res.organizacion_id);
                            sessionStorage.setItem('SIAGOP_ORG_NOMBRE', res.organizacion_nombre);

                            localStorage.setItem('siagop_user_rol', userRol);
                            localStorage.setItem('siagop_user_modulo', userMod);

                            window.location.href = 'visor.html';
                            return;
                        } else if (res && res.mensaje) {
                            if (errDiv) {
                                errDiv.textContent = res.mensaje;
                                errDiv.classList.remove('hidden');
                            }
                            btnSubmit.disabled = false;
                            return;
                        }
                    }
                } catch (e) {
                    console.warn('[Login RPC] Error llamando validar_licencia_y_usuario:', e);
                }
            }

            // Fallback de login local si la conexión falla o desarrollo offline
            if (errDiv) {
                errDiv.textContent = 'Sin respuesta del servidor. Verifique su conexión a internet.';
                errDiv.classList.remove('hidden');
            }
            btnSubmit.disabled = false;
        }
    </script>

</body>
</html>
