<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ejemplo: subir a Signed URL (Supabase)</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:20px}
    label{display:block;margin-top:10px}
    input[type=file]{display:block}
    #log{white-space:pre-wrap;background:#f7f7f7;padding:10px;border:1px solid #ddd;margin-top:10px}
    button{margin-top:10px}
  </style>
</head>
<body>
  <h2>Prueba: subida a Supabase via Signed URL</h2>
  <p>Este ejemplo solicita un Signed URL al endpoint <code>/api/sign-upload</code> y sube el archivo con PUT.</p>

  <label>Archivo
    <input id="file" type="file" />
  </label>

  <label>Ruta destino en el bucket (ej: uploads/miarchivo.jpg)
    <input id="path" type="text" placeholder="uploads/miarchivo.jpg" style="width:400px" />
  </label>

  <label>Bucket
    <input id="bucket" type="text" value="ttocc-archivos" style="width:300px" />
  </label>

  <label>Método de autenticación para /api/sign-upload
    <select id="authMode">
      <option value="x-api-key">x-api-key (header)</option>
      <option value="bearer">Bearer JWT</option>
    </select>
  </label>

  <label id="apiKeyLabel">x-api-key
    <input id="apiKey" type="text" placeholder="coloca aquí SIGN_UPLOAD_API_KEY o token" style="width:420px" />
  </label>

  <label>
    ¿Bucket público? (si está público mostrará la URL pública al finalizar)
    <input id="bucketPublic" type="checkbox" />
  </label>

  <button id="btn" disabled>Solicitar Signed URL y subir</button>
  <div id="log">Selecciona un archivo para habilitar el botón.</div>

  <script>
    const fileEl = document.getElementById('file');
    const pathEl = document.getElementById('path');
    const bucketEl = document.getElementById('bucket');
    const btn = document.getElementById('btn');
    const logEl = document.getElementById('log');
    const apiKeyEl = document.getElementById('apiKey');
    const authModeEl = document.getElementById('authMode');
    const bucketPublicEl = document.getElementById('bucketPublic');

    function log(msg){
      logEl.textContent = (new Date().toISOString()) + ' - ' + msg + '\n' + logEl.textContent;
    }

    fileEl.addEventListener('change', () => {
      if (fileEl.files && fileEl.files.length) {
        const f = fileEl.files[0];
        if (!pathEl.value) pathEl.value = 'uploads/' + f.name;
        btn.disabled = false;
      } else {
        btn.disabled = true;
      }
    });

    authModeEl.addEventListener('change', () => {
      const mode = authModeEl.value;
      apiKeyEl.placeholder = mode === 'x-api-key' ? 'SIGN_UPLOAD_API_KEY (x-api-key header)' : 'Bearer JWT (Authorization header)';
    });

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        const file = fileEl.files[0];
        if (!file) throw new Error('Selecciona un archivo');
        const path = pathEl.value.trim();
        if (!path) throw new Error('Indica la ruta destino en el bucket');
        const bucket = bucketEl.value.trim() || 'ttocc-archivos';

        log('Pidiendo Signed URL al backend...');
        // Llamar al endpoint local del server (asegúrate que sign-upload-auth.js esté corriendo)
        const payload = { bucket, path, expires: 600 };
        const headers = { 'Content-Type': 'application/json' };
        const authMode = authModeEl.value;
        if (authMode === 'x-api-key') headers['x-api-key'] = apiKeyEl.value.trim();
        else if (authMode === 'bearer') headers['Authorization'] = 'Bearer ' + apiKeyEl.value.trim();

        const signRes = await fetch('/api/sign-upload', { method: 'POST', headers, body: JSON.stringify(payload) });
        const signText = await signRes.text();
        if (!signRes.ok) {
          log('Error al pedir signed URL: ' + signRes.status + ' - ' + signText);
          throw new Error('Fallo sign: ' + signText);
        }
        const signJson = JSON.parse(signText);
        const signedUrl = signJson.signedUrl || signJson.signedURL || signJson.signedurl;
        if (!signedUrl) throw new Error('signedUrl no encontrado en respuesta: ' + signText);
        log('Signed URL recibido. Subiendo archivo con PUT...');

        // Subir con PUT
        const putRes = await fetch(signedUrl, {
          method: 'PUT',
          headers: { 'Content-Type': file.type || 'application/octet-stream' },
          body: file
        });
        const putText = await putRes.text();
        if (!putRes.ok) {
          log('Error upload: ' + putRes.status + ' - ' + putText);
          throw new Error('Upload failed: ' + putText);
        }

        log('Upload OK.');

        if (bucketPublicEl.checked) {
          // Construir URL pública (si el bucket es público)
          const supabaseProjectUrl = prompt('Introduce SUPABASE_PROJECT_URL (ej: https://mfklcwrpgavaxznkxlra.supabase.co) para construir la URL pública:', '');
          if (supabaseProjectUrl) {
            const publicUrl = supabaseProjectUrl.replace(/\/$/, '') + '/storage/v1/object/public/' + encodeURIComponent(bucket) + '/' + path;
            log('Public URL: ' + publicUrl);
            // abrir en nueva pestaña
            if (confirm('Abrir URL pública en nueva pestaña?')) window.open(publicUrl, '_blank');
          } else {
            log('No se construyó la URL pública (no se proporcionó SUPABASE_PROJECT_URL).');
          }
        }

      } catch (err) {
        log('Error: ' + (err.message || err));
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
