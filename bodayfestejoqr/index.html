<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boda & Festejo - Comparte tus Fotos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between font-sans">

    <!-- Header -->
    <header class="w-full max-w-md p-6 text-center">
        <h1 class="text-3xl font-bold tracking-tight text-amber-400">Nuestra Boda y Festejo</h1>
        <p class="text-sm text-slate-400 mt-1">Sube tus fotos desde la iglesia hasta la fiesta 📸</p>
    </header>

    <!-- Contenedor Principal -->
    <main class="w-full max-w-md p-4 flex-1 flex flex-col items-center">
        
        <!-- Vista de Subida -->
        <div id="upload-view" class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col items-center">
            
            <label for="file-input" class="w-full border-2 border-dashed border-slate-700 hover:border-amber-400 rounded-xl p-8 flex flex-col items-center cursor-pointer transition bg-slate-950/50">
                <svg class="w-12 h-12 text-amber-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span class="text-sm font-medium text-slate-200">Toca aquí para elegir fotos o tomar una</span>
                <span class="text-xs text-slate-500 mt-1">Puedes seleccionar varias a la vez</span>
            </label>
            <input type="file" id="file-input" accept="image/*" multiple class="hidden">

            <!-- Previsualización -->
            <div id="preview-container" class="w-full grid grid-cols-3 gap-2 mt-4 hidden"></div>

            <button id="upload-btn" onclick="uploadPhotos()" class="w-full mt-6 bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold py-3 rounded-xl transition shadow-lg hidden">
                Subir al Álbum 🚀
            </button>

            <div id="loading" class="hidden mt-4 text-amber-400 text-sm animate-pulse">
                Subiendo recuerdos... Por favor espera.
            </div>

            <div id="success-msg" class="hidden mt-4 text-emerald-400 text-sm text-center font-medium">
                ¡Fotos subidas con éxito! Gracias por compartir este momento 🎉
            </div>
        </div>

        <!-- Botón para ver el Mural en Vivo (Estilo Kululu Slideshow) -->
        <button onclick="toggleLiveWall()" class="mt-6 text-xs text-slate-400 hover:text-amber-400 underline transition">
            🖥️ Abrir Mural en Vivo para Pantallas / Proyector
        </button>
    </main>

    <!-- Modal / Vista de Mural en Vivo -->
    <div id="live-wall-modal" class="fixed inset-0 bg-slate-950/95 z-50 hidden flex flex-col p-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-amber-400">Mural en Vivo - Festejo</h2>
            <button onclick="toggleLiveWall()" class="bg-slate-800 px-4 py-2 rounded-lg text-sm hover:bg-slate-700">Cerrar ✕</button>
        </div>
        <div id="wall-grid" class="flex-1 grid grid-cols-2 md:grid-cols-4 gap-4 overflow-y-auto p-2">
            <!-- Las fotos se cargan aquí en tiempo real -->
        </div>
    </div>

    <footer class="w-full text-center py-4 text-xs text-slate-600">
        Creado para un recuerdo inolvidable
    </footer>

    <script>
        const SCRIPT_URL = "TU_URL_DE_APLICACION_WEB_DE_APPS_SCRIPT";
        let selectedFiles = [];

        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('preview-container');
        const uploadBtn = document.getElementById('upload-btn');
        const loading = document.getElementById('loading');
        const successMsg = document.getElementById('success-msg');

        fileInput.addEventListener('change', (e) => {
            selectedFiles = Array.from(e.target.files);
            previewContainer.innerHTML = '';
            if (selectedFiles.length > 0) {
                previewContainer.classList.remove('hidden');
                uploadBtn.classList.remove('hidden');
                selectedFiles.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.className = 'w-full h-24 object-cover rounded-lg border border-slate-700';
                        previewContainer.appendChild(img);
                    }
                    reader.readAsDataURL(file);
                });
            } else {
                previewContainer.classList.add('hidden');
                uploadBtn.classList.add('hidden');
            }
        });

        async function uploadPhotos() {
            if (selectedFiles.length === 0) return;
            uploadBtn.classList.add('hidden');
            loading.classList.remove('hidden');

            for (let file of selectedFiles) {
                const base64 = await toBase64(file);
                const payload = {
                    fileName: file.name,
                    mimeType: file.type,
                    fileBase64: base64
                };

                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                } catch (err) {
                    console.error("Error al subir:", err);
                }
            }

            loading.classList.add('hidden');
            successMsg.classList.remove('hidden');
            selectedFiles = [];
            previewContainer.innerHTML = '';
            previewContainer.classList.add('hidden');
            
            setTimeout(() => {
                successMsg.classList.add('hidden');
            }, 5000);
        }

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        // Funcionalidad del Mural en Vivo (Slideshow / Galería automática)
        async function toggleLiveWall() {
            const modal = document.getElementById('live-wall-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                loadWallPhotos();
            }
        }

        async function loadWallPhotos() {
            const grid = document.getElementById('wall-grid');
            grid.innerHTML = '<p class="col-span-full text-center text-slate-500 animate-pulse">Cargando fotos del evento...</p>';
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getPhotos`);
                const data = await res.json();
                if (data.status === 'success' && data.photos.length > 0) {
                    grid.innerHTML = '';
                    data.photos.forEach(photo => {
                        const card = document.createElement('div');
                        card.className = 'relative group rounded-xl overflow-hidden bg-slate-900 border border-slate-800 aspect-square';
                        card.innerHTML = `<img src="${photo.url}" class="w-full h-full object-cover">`;
                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = '<p class="col-span-full text-center text-slate-500">Aún no hay fotos subidas. ¡Sé el primero!</p>';
                }
            } catch (err) {
                grid.innerHTML = '<p class="col-span-full text-center text-red-400">Error al cargar las fotos.</p>';
            }
        }
    </script>
</body>
</html>
