<!DOCTYPE html>
<html lang="es" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural en Vivo - Festejo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        @keyframes floatSide {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(1.5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .animate-floating-card { animation: floatSide 5s ease-in-out infinite; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen overflow-hidden flex flex-col justify-between p-6 select-none relative font-sans">

    <!-- Header -->
    <header class="flex justify-between items-center z-20 border-b border-slate-800/80 pb-4 px-2">
        <div>
            <h1 id="mural-title" class="text-3xl font-extrabold tracking-tight text-amber-400">Irama & Miguel</h1>
            <p class="text-sm text-slate-400 mt-0.5">Escanea el código QR para compartir tus fotos en tiempo real 📸</p>
        </div>
        <div class="flex items-center gap-3 bg-slate-900/80 backdrop-blur border border-slate-800 px-5 py-2.5 rounded-2xl shadow-xl">
            <span class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></span>
            <span class="text-sm font-semibold text-slate-200 tracking-wide">EN VIVO</span>
        </div>
    </header>

    <!-- Área Principal -->
    <main class="flex-1 flex items-center justify-between relative my-2 overflow-hidden px-4">
        
        <!-- Carrusel Lateral Izquierdo -->
        <div class="w-48 hidden xl:flex flex-col justify-around h-full py-8 pointer-events-none z-10 opacity-85">
            <div class="animate-floating-card bg-slate-900/90 backdrop-blur border border-slate-800 p-2.5 rounded-3xl shadow-2xl w-36 rotate-[-5deg]">
                <img id="thumb-left-1" src="" class="w-full h-28 object-cover rounded-2xl bg-slate-950">
            </div>
            <div class="animate-floating-card bg-slate-900/90 backdrop-blur border border-slate-800 p-2.5 rounded-3xl shadow-2xl w-32 translate-x-6 rotate-[3deg]" style="animation-delay: 2.5s;">
                <img id="thumb-left-2" src="" class="w-full h-24 object-cover rounded-2xl bg-slate-950">
            </div>
        </div>

        <!-- Spotlight Central -->
        <div class="flex-1 max-w-4xl mx-auto h-[72vh] flex items-center justify-center relative">
            <div id="spotlight-container" class="relative w-full h-full bg-slate-900/60 backdrop-blur border border-slate-800/80 rounded-3xl overflow-hidden shadow-2xl flex items-center justify-center">
                <img id="spotlight-img" src="" alt="Momento Destacado" class="w-full h-full object-contain bg-slate-950/80 transition-all duration-700">
                
                <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-slate-950/95 via-slate-950/50 to-transparent p-6 flex justify-between items-end">
                    <div>
                        <span id="spotlight-author" class="text-base font-bold text-amber-400 drop-shadow">📸 Esperando recuerdos...</span>
                        <p id="spotlight-caption" class="text-sm text-slate-200 mt-1 italic"></p>
                    </div>
                    
                    <div class="flex items-center gap-2 bg-slate-900/90 backdrop-blur border border-slate-700/60 px-4 py-2 rounded-full shadow-lg">
                        <svg class="w-5 h-5 text-rose-500 fill-current" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <span id="spotlight-likes" class="text-sm font-bold text-slate-100">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Carrusel Lateral Derecho -->
        <div class="w-48 hidden xl:flex flex-col justify-around h-full py-8 pointer-events-none z-10 opacity-85">
            <div class="animate-floating-card bg-slate-900/90 backdrop-blur border border-slate-800 p-2.5 rounded-3xl shadow-2xl w-32 -translate-x-6 rotate-[4deg]" style="animation-delay: 1.2s;">
                <img id="thumb-right-1" src="" class="w-full h-24 object-cover rounded-2xl bg-slate-950">
            </div>
            <div class="animate-floating-card bg-slate-900/90 backdrop-blur border border-slate-800 p-2.5 rounded-3xl shadow-2xl w-36 rotate-[-4deg]" style="animation-delay: 3.5s;">
                <img id="thumb-right-2" src="" class="w-full h-28 object-cover rounded-2xl bg-slate-950">
            </div>
        </div>
    </main>

    <!-- Componente QR Interactivo (Draggable/Zoom) -->
    <div id="qr-box" class="fixed top-24 right-8 z-50 bg-slate-900/95 border-2 border-amber-500/80 rounded-2xl p-4 shadow-2xl backdrop-blur-md cursor-move flex flex-col items-center group transition-all duration-200">
        <div class="w-full flex justify-end gap-1.5 mb-2 opacity-70 group-hover:opacity-100 transition">
            <button onclick="adjustQRSize(-20)" class="text-slate-400 hover:text-amber-400 p-1 rounded hover:bg-slate-800 transition" title="Reducir"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"/></svg></button>
            <button onclick="adjustQRSize(20)" class="text-slate-400 hover:text-amber-400 p-1 rounded hover:bg-slate-800 transition" title="Agrandar"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg></button>
            <button onclick="toggleQRBox()" class="text-slate-400 hover:text-rose-400 p-1 rounded hover:bg-slate-800 transition ml-1" title="Ocultar"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg></button>
        </div>

        <p class="text-xs font-bold text-amber-400 mb-2 text-center max-w-[170px]">Escanea para ver o añadir fotos 📸</p>
        <div class="bg-white p-2.5 rounded-xl shadow-inner border border-amber-400/50">
            <img id="qr-img" src="" alt="QR Evento" class="w-36 h-36 object-contain">
        </div>
    </div>

    <!-- Footer -->
    <footer class="flex justify-between items-center text-xs text-slate-500 border-t border-slate-900 pt-3 px-2 z-10">
        <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800/80 px-4 py-2 rounded-full shadow-lg flex items-center gap-2">
            <span class="text-amber-400 text-sm animate-pulse">❤️</span>
            <span class="text-slate-300 font-medium">Sincronización en Tiempo Real</span>
        </div>
        <span>Disfruta cada instante</span>
    </footer>

    <script>
        let photos = [];
        let currentIndex = 0;
        let spotlightInterval = null;

        window.onload = () => {
            const guestUrl = window.location.href.replace('mural.html', 'index.html');
            document.getElementById('qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(guestUrl)}`;
            
            fetchMuralData();
            setInterval(fetchMuralData, 5000); // Polling desde Supabase cada 5s
            initDraggableQR();
        };

        async function fetchMuralData() {
            const { data } = await supabaseClient.from('photos').select('*').eq('is_approved', true).order('created_at', { ascending: false });
            if (data && data.length > 0) {
                photos = data;
                
                if (photos.length >= 4) {
                    document.getElementById('thumb-left-1').src = photos[0].url;
                    document.getElementById('thumb-left-2').src = photos[1].url;
                    document.getElementById('thumb-right-1').src = photos[2].url;
                    document.getElementById('thumb-right-2').src = photos[3].url;
                }

                if (!spotlightInterval) {
                    updateSpotlight();
                    spotlightInterval = setInterval(() => {
                        currentIndex = (currentIndex + 1) % photos.length;
                        updateSpotlight();
                    }, 5000);
                }
            }
        }

        function updateSpotlight() {
            if (photos.length === 0) return;
            const photo = photos[currentIndex];
            document.getElementById('spotlight-img').src = photo.url;
            document.getElementById('spotlight-author').innerText = `📸 ${photo.author || 'Invitado'}`;
            document.getElementById('spotlight-caption').innerText = photo.caption ? `"${photo.caption}"` : '';
            document.getElementById('spotlight-likes').innerText = photo.likes || 0;
        }

        let currentQRSize = 144;
        function adjustQRSize(delta) {
            currentQRSize = Math.min(Math.max(100, currentQRSize + delta), 260);
            document.getElementById('qr-img').style.width = `${currentQRSize}px`;
            document.getElementById('qr-img').style.height = `${currentQRSize}px`;
        }
        function toggleQRBox() { document.getElementById('qr-box').classList.toggle('hidden'); }

        function initDraggableQR() {
            const qrBox = document.getElementById("qr-box");
            let isDragging = false, startX = 0, startY = 0;
            qrBox.addEventListener("mousedown", (e) => {
                if (e.target.closest('button')) return;
                isDragging = true;
                startX = e.clientX - qrBox.offsetLeft;
                startY = e.clientY - qrBox.offsetTop;
            });
            document.addEventListener("mousemove", (e) => {
                if (!isDragging) return;
                qrBox.style.left = `${e.clientX - startX}px`;
                qrBox.style.top = `${e.clientY - startY}px`;
                qrBox.style.right = "auto";
            });
            document.addEventListener("mouseup", () => isDragging = false);
        }
    </script>
</body>
</html>
